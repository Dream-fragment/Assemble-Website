<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success — Assemble</title>
    <link rel="icon" type="image/png" href="app-logo.png">
    <link rel="stylesheet" href="styles/oauth.css">
    <style>
        .success-check {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #d969ac, #c48bb8);
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(217, 105, 172, 0.35);
        }
        .success-sub { color: #9b6b8a; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="app-logo.png" alt="Assemble logo" class="navbar-logo">
            <span class="navbar-title">Assemble</span>
        </a>
    </nav>

    <div class="container">
        <div class="success-check">✓</div>
        <h1>Success!</h1>
        <p class="success-sub">You can now return to the Assemble app to continue.</p>
        <a id="return-btn" class="download-btn" href="assemble://auth-callback">Return to Assemble</a>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const hash = window.location.hash;
            const isRecovery = params.get('flow') === 'recovery';

            let target = 'assemble://auth-callback';
            if (isRecovery) target += '?flow=recovery';

            if (params.has('code')) {
                target += (isRecovery ? '&' : '?') + 'code=' + params.get('code');
            } else if (hash && hash.length > 1) {
                target += hash;   // access_token / refresh_token / type 原樣帶走
            }

            if (isRecovery) {
                document.querySelector('h1').textContent = 'Reset your password';
                document.querySelector('.success-sub').textContent =
                    'Return to the Assemble app to choose a new password.';
            }

            document.getElementById('return-btn').href = target;
            setTimeout(function () { window.location.href = target; }, 500);
        })();

    </script>
</body>
</html>
